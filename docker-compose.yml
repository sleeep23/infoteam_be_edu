services: # 실행할 컨테이너 목록 정의
  postgres: # 서비스 이름 설정하는거
    image: postgres:16 # 도커 허브에서 16버전 이미지 사용
    container_name: nest_postgres # 컨테이너 이름 (docker ps 에서 나오는 이름)
    ports: # 호스트:컨테이너 포트 매핑 / 여기선 내 호스트 5432포트 - 컨테이너 5432포트 끼리 매핑한거
      - '5432:5432'
    environment: # 환경변수 설정
      POSTGRES_DB: nest_db # 생성할 데이터베이스 이름
      POSTGRES_USER: nest_user # DB 접속 유저 이름
      POSTGRES_PASSWORD: nest_password # DB 접속 유저 비밀번호
    volumes:
      - postgres_data:/var/lib/postgresql/data # 컨테이너 재시작해도 데이터 유지되게끔 볼륨에 저장

volumes:
  postgres_data: # 도커가 위에서 사용된 볼륨을 관리하도록 선언하는거
